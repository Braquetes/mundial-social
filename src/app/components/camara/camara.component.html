<section class="camara">
  <!-- Flash overlay -->
  <div class="camara__flash" [class.camara__flash--activo]="flashActivo()"></div>
  <!-- Selector de cámara -->
  @if (camaras().length > 0) {
  <div class="camara__selector">
    <select [value]="camaraSeleccionada()" (change)="onCamaraChange($event)">
      <option *ngFor="let cam of camaras(); let i = index" [value]="cam.deviceId">
        [{{ i }}] {{ cam.label || 'Cámara sin nombre' }}
        {{ cam.label.includes('front') ? '(Frontal)' :
        cam.label.includes('back') ? '(Trasera)' : '' }}
      </option>
    </select>
  </div>
  }
  <!-- Info visible en iPad -->
  <div
    style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 12px; border-radius: 8px; z-index: 9999; font-size: 12px;">
    📷 Cámara:
    <span id="camaraNombre">Cargando...</span>
  </div>
  <!-- Video feed -->
  <div class="camara__visor">
    <video #videoEl class="camara__video" autoplay playsinline muted></video>

    <!-- Countdown overlay -->
    @if (estado() === 'contando') {
    <div class="camara__countdown">
      <span class="camara__cuenta" [attr.data-num]="cuenta()">{{ cuenta() }}</span>
    </div>
    }

    <!-- Corner guides -->
    <div class="camara__guide camara__guide--tl"></div>
    <div class="camara__guide camara__guide--tr"></div>
    <div class="camara__guide camara__guide--bl"></div>
    <div class="camara__guide camara__guide--br"></div>
  </div>

  <!-- Error state -->
  @if (estado() === 'error') {
  <div class="camara__error">
    <span class="camara__error-icon">📵</span>
    <p>{{ errorMsg() }}</p>
  </div>
  }

  <!-- Controls -->
  <div class="camara__controls">
    <button class="camara__btn-volver" (click)="volver()"
      [disabled]="estado() === 'contando' || estado() === 'capturando'">
      ←
    </button>

    <button class="camara__btn-captura" (click)="tomarFoto()" [disabled]="estado() !== 'lista'"
      [class.camara__btn-captura--activo]="estado() === 'lista'" aria-label="Tomar foto">
      <span class="camara__btn-captura-inner"></span>
    </button>

    <!-- Spacer to center capture button -->
    <div style="width: 52px;"></div>
  </div>

  <!-- Hint -->
  @if (estado() === 'lista') {
  <p class="camara__hint">Presiona el botón para iniciar el temporizador de 3 segundos</p>
  }
</section>
